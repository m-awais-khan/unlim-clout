name: Build and Package Desktop App

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (e.g. v0.1.0, leave empty for artifact-only build)'
        required: false
        default: ''

jobs:
  validate-docker:
    name: Validate Worker Docker Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Worker Image
        uses: docker/build-push-action@v5
        with:
          context: ./worker
          file: ./worker/Dockerfile
          push: false
          tags: clout-colab-worker:latest

  build-desktop:
    name: Build Windows Desktop App
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Setup Python
        run: uv python install 3.12

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install Backend Build Dependencies
        shell: pwsh
        run: |
          uv pip install --system -r backend/requirements-build.txt

      - name: Compile Backend Sidecar (PyInstaller)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "src-tauri\bin" -Force | Out-Null
          pyinstaller backend/unlim_clout_backend.spec --distpath src-tauri/bin --noconfirm
          if (-not (Test-Path "src-tauri/bin/backend-x86_64-pc-windows-msvc.exe")) {
            throw "PyInstaller failed: backend-x86_64-pc-windows-msvc.exe was not created!"
          }
          Write-Host "Successfully compiled backend sidecar binary." -ForegroundColor Green

      - name: Install Frontend Dependencies & Build
        shell: pwsh
        run: |
          cd frontend
          npm ci
          npm run build
          cd ..
          Write-Host "Frontend build completed." -ForegroundColor Green

      - name: Install Root Dependencies
        shell: pwsh
        run: |
          npm install

      - name: Build Tauri Desktop Application
        shell: pwsh
        run: |
          if (Test-Path "C:\Program Files (x86)\WiX Toolset v3.11\bin") {
            $env:PATH = "C:\Program Files (x86)\WiX Toolset v3.11\bin;$env:PATH"
          }
          npx @tauri-apps/cli build

      - name: Collect Deliverables
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "dist-desktop" -Force | Out-Null
          $nsisFiles = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue
          $msiFiles = Get-ChildItem -Path "src-tauri/target/release/bundle/msi/*.msi" -ErrorAction SilentlyContinue
          
          if ($nsisFiles) {
            Copy-Item -Path $nsisFiles -Destination dist-desktop/ -Force
          }
          if ($msiFiles) {
            Copy-Item -Path $msiFiles -Destination dist-desktop/ -Force
          }
          
          $standaloneExe = "src-tauri/target/release/unlim-clout-desktop.exe"
          if (Test-Path $standaloneExe) {
            Copy-Item -Path $standaloneExe -Destination dist-desktop/UnlimClout-portable.exe -Force
          }
          
          $backendExe = "src-tauri/bin/backend-x86_64-pc-windows-msvc.exe"
          if (Test-Path $backendExe) {
            Copy-Item -Path $backendExe -Destination dist-desktop/backend.exe -Force
          }
          
          Write-Host "Collected artifacts in dist-desktop:" -ForegroundColor Cyan
          Get-ChildItem -Path dist-desktop

      - name: Upload Desktop Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Unlim-Clout-Windows-Setup
          path: dist-desktop/*
          retention-days: 30

      - name: Determine Release Tag
        id: get_tag
        shell: pwsh
        run: |
          $ref = "${{ github.ref_name }}"
          if ("${{ github.event_name }}" -eq "workflow_dispatch" -and "${{ inputs.release_tag }}" -ne "") {
            $tag = "${{ inputs.release_tag }}"
          } elseif ($ref -match '^v\d+') {
            $tag = $ref
          } else {
            $tauriConfig = Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json
            $tag = "v$($tauriConfig.version)"
          }
          echo "tag=$tag" >> $env:GITHUB_OUTPUT
          echo "is_release=true" >> $env:GITHUB_OUTPUT
          Write-Host "Target Release Tag: $tag" -ForegroundColor Green

      - name: Create or Update GitHub Release
        if: steps.get_tag.outputs.is_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_tag.outputs.tag }}
          name: "Unlim Clout ${{ steps.get_tag.outputs.tag }}"
          files: dist-desktop/*
          draft: false
          prerelease: false
          generate_release_notes: true
